name: scorecard

# An automated read of this repository's supply-chain posture — pinned actions, branch protection, token permissions,
# whether releases are signed, whether a vulnerability can be reported privately.
#
# The other checks all test the code, and none of them look at how the code gets published. Results land in the code
# scanning dashboard. It reports; it changes nothing.

on:
  schedule:
    # Weekly, early on Monday.
    - cron: "0 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

# Queued, not cancelled: this job exists to leave a result behind, and a cancelled run leaves none.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: analyse
    # The results are published to the public Scorecard API and uploaded to code scanning, neither of which a private
    # repository on the free plan has.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      # To upload the result to the code scanning dashboard.
      security-events: write
      # For the signed attestation the check publishes about its own run.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Pinned to the commit the release tag points at, not to the tag object: the annotated tag's own SHA is a different
      # object, and a pin is only a pin when it names a commit.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
